            --bg-color: #0b0f19;

            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-glow: #3b82f6;
            --accent-color: #2563eb;
            --border-color: rgba(59, 130, 246, 0.3);
            --glow-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            --hover-glow: 0 0 30px rgba(59, 130, 246, 0.7);
        }

        [data-theme="light"] {
            --bg-color: #f0f4f8;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --card-bg: rgba(243, 244, 246, 0.8);
            --text-color: #1f2937;
            --text-muted: #4b5563;
            --accent-glow: #2563eb;
            --accent-color: #1d4ed8;
            --border-color: rgba(37, 99, 235, 0.25);
            --glow-shadow: 0 0 15px rgba(37, 99, 235, 0.25);
            --hover-glow: 0 0 25px rgba(37, 99, 235, 0.4);

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;

        body {

        /* خلفية السماء والنجوم المتحركة بدقة عالية */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;

        /* حاوية التحكم العلوية (شريط الأدوات) */

            position: fixed;
            top: 20px;
            left: 20px;

            gap: 12px;
            z-index: 1000;

        .tool-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: var(--glow-shadow);
            display: flex;
            align-items: center;
            gap: 8px;

            left: 0;

            border: 1px solid var(--border-color);
            padding: 10px;

            border: 2px solid white;

    <script>
        // --- 1. خلفية السماء والنجوم بدقة عالية ---
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function initStars() {
            stars = [];
            const count = Math.floor((width * height) / 4000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            ctx.fillStyle = isLight ? 'rgba(0, 0, 0, 0.15)' : 'rgba(255, 255, 255, 0.85)';
            
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();

                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) {
                    star.speed = -star.speed;
                }
            });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initStars();
        });
        resizeCanvas();
        initStars();
        animateStars();

        // --- 2. إدارة الثيم (ليل/نهار) ---
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.className = 'fa-solid fa-moon';
                themeText.textContent = 'الوضع الليلي';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeIcon.className = 'fa-solid fa-sun';
                themeText.textContent = 'الوضع النهاري';
            }
        });

        // --- 3. اختيار لون الموقع الضوئي ---
        const colorPickerBtn = document.getElementById('color-picker-btn');
        const colorDropdown = document.getElementById('color-dropdown');

        colorPickerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            colorDropdown.classList.toggle('active');
        });

        document.addEventListener('click', () => {
            colorDropdown.classList.remove('active');
        });

        document.querySelectorAll('.color-circle').forEach(circle => {
            circle.addEventListener('click', (e) => {
                const color = e.target.getAttribute('data-color');
                document.documentElement.style.setProperty('--accent-glow', color);
                document.documentElement.style.setProperty('--accent-color', color);
                document.documentElement.style.setProperty('--border-color', color + '55');
                colorDropdown.classList.remove('active');
            });
        });

        // --- 5. تعبئة قائمة القصص ---
        const storySelect = document.getElementById('story-select');
        const storyLinesContainer = document.getElementById('story-lines-container');

        stories.forEach(story => {
            const option = document.createElement('option');
            option.value = story.id;
            option.textContent = story.title;
            storySelect.appendChild(option);
        });

        let currentActiveStoryId = 1;

        function renderStory(storyId) {
            currentActiveStoryId = parseInt(storyId);
            storySelect.value = currentActiveStoryId;
            const story = stories.find(s => s.id == currentActiveStoryId);
            storyLinesContainer.innerHTML = '';

            story.lines.forEach((line, index) => {
                const item = document.createElement('div');
                item.className = 'story-line-item';
                item.setAttribute('data-line-index', index);
                item.innerHTML = `
                    <div class="line-top-row">
                        <div class="german-text">${index + 1}. ${line.de}</div>
                        <button class="line-audio-btn" onclick="speakSingleLine(${index}, '${line.de.replace(/'/g, "\'")}')" title="استمع لهذا السطر">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                    <div class="arabic-text">${line.ar}</div>
                `;
                storyLinesContainer.appendChild(item);
            });
        }

        storySelect.addEventListener('change', (e) => {
            stopReading();
            renderStory(e.target.value);
        });

        // زر القصة التالية
        document.getElementById('next-story-btn').addEventListener('click', () => {
            stopReading();
            let nextId = currentActiveStoryId + 1;
            if (nextId > 100) nextId = 1; // العودة للأولى عند النهاية
            renderStory(nextId);
            storyLinesContainer.scrollTop = 0;
        });

        // تحميل القصة الأولى افتراضياً
        renderStory(1);

        // --- 6. محرك القراءة الصوتية مع إضاءة السطر والتمرير التلقائي ---
        let currentUtterance = null;
        let isPlayingAll = false;
        let playAllIndex = 0;

        function clearHighlights() {
            const allItems = storyLinesContainer.querySelectorAll('.story-line-item');
            allItems.forEach(el => el.classList.remove('active-line'));
        }

        function highlightLine(index) {
            clearHighlights();
            const item = storyLinesContainer.querySelector(`[data-line-index="${index}"]`);
            if (item) {
                item.classList.add('active-line');
                // جعل القارئ ينزل تلقائياً مع السطر المقروء
                item.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function speakSingleLine(index, text) {
            stopReading();
            highlightLine(index);
            speakText(text, () => {
                clearHighlights();
            });
        }

        function speakText(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                const speedSelect = document.getElementById('speech-speed');
                utterance.rate = parseFloat(speedSelect.value);

                utterance.onend = () => {
                    if (callback) callback();
                };

                currentUtterance = utterance;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('عذراً، متصفحك لا يدعم خاصية القراءة الصوتية.');
            }
        }

        function playAllLines() {
            const story = stories.find(s => s.id == currentActiveStoryId);
            if (!story) return;

            isPlayingAll = true;
            playAllIndex = 0;

            function playNext() {
                if (!isPlayingAll || playAllIndex >= story.lines.length) {
                    isPlayingAll = false;
                    clearHighlights();
                    return;
                }
                const currentIndex = playAllIndex;
                const line = story.lines[currentIndex];
                playAllIndex++;

                highlightLine(currentIndex);
                
                speakText(line.de, () => {
                    setTimeout(playNext, 400); // توقف قصير وطبيعي بين السطور
                });
            }
            playNext();
        }

        function stopReading() {
            isPlayingAll = false;
            clearHighlights();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        document.getElementById('play-all-btn').addEventListener('click', playAllLines);
        document.getElementById('pause-all-btn').addEventListener('click', stopReading);

    </script>
